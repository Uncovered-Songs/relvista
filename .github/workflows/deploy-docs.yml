name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site and editor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds core → renderer → docusaurus-plugin → editor → docs; the docs build copies the editor into
      # apps/docs/build/editor/, so one artifact serves /relvista/ and /relvista/editor/.
      - name: Build packages, editor and docs
        run: pnpm docs:build

      - name: Check the editor is in the artifact
        run: test -f apps/docs/build/editor/index.html

      - name: Check third-party notices are up to date and shipped
        run: |
          pnpm notices:check
          test -f apps/docs/build/editor/THIRD_PARTY_NOTICES.txt
          test -f apps/docs/build/third-party-notices.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
