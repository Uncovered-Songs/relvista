version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Keep exact pins (e.g. "@dbml/parse": "12.1.0") exact; bump ranges only when needed.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore
      include: scope
    groups:
      dbml:
        patterns:
          - '@dbml/*'
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - '@dbml/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
