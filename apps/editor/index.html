<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="relvista: open-source DBML editor with a live ER diagram. Your files, no account."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1f28" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="relvista" />
    <meta property="og:title" content="relvista editor" />
    <meta
      property="og:description"
      content="relvista: open-source DBML editor with a live ER diagram. Your files, no account."
    />
    <meta property="og:url" content="https://relvista.org/editor/" />
    <meta property="og:image" content="https://relvista.org/editor/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="relvista: DBML entity-relationship diagrams, open source"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://relvista.org/editor/social-preview.png" />
    <meta
      name="twitter:image:alt"
      content="relvista: DBML entity-relationship diagrams, open source"
    />
    <title>relvista editor</title>
    <script>
      // Theme bootstrap (no flash): shares localStorage 'theme' with the Docusaurus site.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('theme');
        } catch (_) {}
        var dark =
          t === 'dark' ||
          (t !== 'light' &&
            window.matchMedia &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The relvista editor needs JavaScript.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
