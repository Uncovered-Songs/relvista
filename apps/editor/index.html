<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="relvista: open-source DBML editor with a live ER diagram. Your files, no account."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>relvista editor</title>
    <script>
      // Theme bootstrap (no flash): shares localStorage 'theme' with the Docusaurus site.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('theme');
        } catch (_) {}
        var dark =
          t === 'dark' ||
          (t !== 'light' &&
            window.matchMedia &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The relvista editor needs JavaScript.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
